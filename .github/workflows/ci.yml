name: CI
# Runs on the Pi itself (self-hosted runner, ~/actions-runner). Every push to
# main: syntax-check + offline test suite in the runner's clean checkout, and
# only if green, fast-forward the live ~/dashboard and restart services.
# The runner user is screenrpi (passwordless sudo), so deploy steps are local.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile $(git ls-files '*.py')

      - name: Jarvis routing suite (offline, 39 cases)
        run: python3 test_jarvis.py

      - name: Deploy to live dashboard
        run: |
          cd /home/screenrpi/dashboard
          git fetch origin main
          # ff-only: refuses (and fails the run) if the live copy has diverged
          # from what was pushed — never silently clobbers live-edited state
          git merge --ff-only origin/main
          sudo systemctl restart dashboard pibot
          sleep 4

      - name: Smoke check
        run: |
          # poll up to 20s: a slow restart must not read as a deploy failure
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/stats >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/stats > /dev/null
          curl -sf http://127.0.0.1:8080/ | grep -q sysCard
          systemctl is-active dashboard pibot

      - name: Telegram alert on failure
        if: failure()
        run: |
          # pibot's token lives on this machine; no GitHub secret needed
          . /home/screenrpi/.pibot_token 2>/dev/null || exit 0
          curl -s --max-time 10 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="❌ dashboard CI failed on $(git rev-parse --short HEAD): ${{ github.event.head_commit.message }}" > /dev/null || true
